[project]
name = "icicle"
version = "0.1.0"
description = "Structure elucidation of unknown molecules with physics-constrained neural simulation of electron ionization mass spectrometry"
authors = [
    {name = "Magdalena Lederbauer", email = "magled@mit.edu"},
    {name = "Runzhong Wang"},
    {name = "Connor W. Coley"},
]
maintainers = [
    {name = "Magdalena Lederbauer", email = "magled@mit.edu"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "h5py>=3.13.0",
    "hydra-core>=1.3.2",
    "hydra-optuna-sweeper>=1.2.0",
    "lightning>=2.5.1.post0",
    "matplotlib>=3.10.3",
    "multiprocess>=0.70.18",
    "pathos>=0.3.4",
    "pypalettes>=0.1.5",
    "rdkit>=2025.3.2",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "torch==2.6.0",
    "torchdata>=0.11.0",
    "torchvision==0.21.0",
    "typer>=0.15.4",
    "wandb>=0.19.11",
    "myopic-mces>=1.0.1",
    "pulp>=3.2.1",
    "xgboost>=3.1.3",
    "plotly>=6.5.2",
    "nbformat>=5.10.4",
    "torch-geometric[cu124]>=2.7.0",
    "hydra-submitit-launcher>=1.2.0",
    "optuna>=2.10.1",
    "jsonpickle>=4.1.1",
    "pyarrow>=23.0.0",
    "ipywidgets>=8.1.8",
    "anywidget>=0.9.21",
    "statannotations>=0.7.2",
    "exmol>=3.3.0",
    "openbabel-wheel>=3.1.1.23",
]

[dependency-groups]
dev = [
    "docformatter>=1.7.7",
    "ipykernel>=6.29.5",
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pyment>=0.3.3",
    "pytest>=8.3.5",
    "ruff>=0.11.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 79
exclude = ["baselines/**"]

[tool.docformatter]
style = "numpy"
recursive = true
wrap-summaries = 79
wrap-descriptions = 79

[project.optional-dependencies]
cpu = ["torch==2.6.0", "torchvision==0.21.0", "dgl", "torch-scatter", "torch-sparse", "torch-geometric"]
cu124 = ["torch==2.6.0+cu124", "torchvision==0.21.0+cu124", "dgl", "torch-scatter", "torch-sparse", "torch-geometric"]
cu118 = ["torch==2.6.0+cu118", "torchvision==0.21.0+cu118", "dgl", "torch-scatter", "torch-sparse", "torch-geometric"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu124" }, { extra = "cu118" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu118", extra = "cu118" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu118", extra = "cu118" },
]
torch-scatter = [
    { index = "pyg-cpu", extra = "cpu" },
    { index = "pyg-cu124", extra = "cu124" },
    { index = "pyg-cu118", extra = "cu118" },
]
torch-sparse = [
    { index = "pyg-cpu", extra = "cpu" },
    { index = "pyg-cu124", extra = "cu124" },
    { index = "pyg-cu118", extra = "cu118" },
]
dgl = [
    { index = "dgl-cu124", extra = "cu124" },
    { index = "dgl-cu118", extra = "cu118" },
]

# If this is your local mirror, keep it, otherwise you can remove this
[[tool.uv.index]]
name = "local-pytorch-mirror"
url = "file:///mnt/home/magled/icicle-dev/pytorch-cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "dgl-cu124"
url = "https://data.dgl.ai/wheels/torch-2.6/cu124/repo.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "dgl-cu118"
url = "https://data.dgl.ai/wheels/torch-2.6/cu118/repo.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cpu"
url = "https://data.pyg.org/whl/torch-2.6.0+cpu.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cu124"
url = "https://data.pyg.org/whl/torch-2.6.0+cu124.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cu118"
url = "https://data.pyg.org/whl/torch-2.6.0+cu118.html"
format = "flat"
explicit = true
