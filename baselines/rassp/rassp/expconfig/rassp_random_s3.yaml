    formula_possible_atomicno:
    - 1
    - 6
    - 7
    - 8
    - 9
    - 15
    - 16
    - 17
    featurize_mode: numerical
    use_highres: true
    num_peaks_per_formula: 12
    max_formulae: 4096
    clip_mass: 511
loss_params:
  loss_name: losses.WeightedMSELoss
  func: l2
  mass_scale: 0.0
  intensity_pow: 0.5
max_epochs: 100
batch_size: 8
accumulate_steps: 2
opt_params:
  lr: 0.00012170370924261076
  optimizer: adam
  weight_decay: 1.0451370879352564e-06
net_params:
  agg_func: sum
  gml_class: GraphMatLayersNormAfterRes
  gml_config:
