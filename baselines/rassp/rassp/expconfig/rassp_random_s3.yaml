      nonlin: relu
  inner_norm: layer
  input_norm: batch
  int_d: 768
  layer_n: 8
  resnet: true
  spect_out_class: MolAttentionGRU
  spect_out_config:
    embedding_key_size: 8
    gru_layer_n: 2
    internal_d: 256
    linear_layer_n: 6
    formula_oh_sizes:
    - 50
    - 46
    - 30
    - 30
    - 30
    - 30
    - 30
    - 30
    formula_oh_accum: true
  g_feature_n: -1
